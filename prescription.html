<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prescription · A Islam Medical Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr"></div>
  <div class="nav" id="nav"></div>
  <div class="cnt">
    <h1 class="ptitle">📋 Prescription <span id="rxid" style="font-size:12px;font-weight:400;color:var(--t3)"></span></h1>

    <div class="card">
      <div class="ct">👤 Patient Info <span class="bn" style="font-size:11px;font-weight:400;color:var(--t3)">রোগীর তথ্য</span></div>
      <div class="docsel">
        <span>👨‍⚕️</span>
        <select id="rxdoc" onchange="updDocInfo()"><option value="">— Select Doctor —</option></select>
      </div>
      <div id="rxdocinfo" style="font-size:11px;color:var(--t3);margin-bottom:10px;padding:0 2px"></div>
      <div class="row r2">
        <div class="fg"><label>Patient Name <span class="lbn">রোগীর নাম</span></label><input type="text" id="rxname" placeholder="Full name"></div>
        <div class="fg"><label>Phone <span class="lbn">মোবাইল</span></label><input type="tel" id="rxphone" value="+8801" placeholder="+8801..."></div>
      </div>
      <div class="row r3">
        <div class="fg">
          <label>Age <span class="lbn">বয়স</span></label>
          <div class="agerow">
            <input type="number" id="rxagenum" min="0" max="120" placeholder="25">
            <select id="rxageunit"><option value="years">Yr/বছর</option><option value="months">Mo/মাস</option></select>
          </div>
        </div>
        <div class="fg"><label>Gender <span class="lbn">লিঙ্গ</span></label>
          <select id="rxgender"><option value="">Select...</option><option value="Male">Male/পুরুষ</option><option value="Female">Female/মহিলা</option><option value="Child">Child/শিশু</option></select>
        </div>
        <div class="fg"><label>BP <span class="lbn">রক্তচাপ</span></label><input type="text" id="rxbp" placeholder="120/80"></div>
      </div>
      <div class="row r3">
        <div class="fg"><label>Weight <span class="lbn">ওজন</span></label><input type="text" id="rxwt" placeholder="55 kg"></div>
        <div class="fg"><label>Fever <span class="lbn">জ্বর</span></label><input type="text" id="rxfv" placeholder="101°F"></div>
        <div class="fg"><label>Temp <span class="lbn">তাপমাত্রা</span></label><input type="text" id="rxtemp" placeholder="98.4°F"></div>
      </div>
      <div class="fg"><label>Complaint / Diagnosis <span class="lbn">সমস্যা</span></label><textarea id="rxcc" placeholder="Chief complaint..."></textarea></div>
    </div>

    <div class="card">
      <div class="ct">💊 Medicines <span class="bn" style="font-size:11px;font-weight:400;color:var(--t3)">ওষুধ</span></div>
      <div class="mtw">
        <table class="mt">
          <thead><tr>
            <th style="width:22px">#</th>
            <th style="min-width:165px;text-align:left;padding-left:7px">Medicine/ওষুধ</th>
            <th style="width:38px">☀️<br><span style="font-size:8px">সকাল</span></th>
            <th style="width:38px">🌤️<br><span style="font-size:8px">দুপুর</span></th>
            <th style="width:38px">🌥️<br><span style="font-size:8px">বিকাল</span></th>
            <th style="width:38px">🌙<br><span style="font-size:8px">রাত</span></th>
            <th style="width:65px">Food<br><span style="font-size:8px">খাবার</span></th>
            <th style="width:48px">Days<br><span style="font-size:8px">দিন</span></th>
            <th style="width:26px"></th>
          </tr></thead>
          <tbody id="rxmeds"></tbody>
        </table>
      </div>
      <button class="amb" onclick="addMedRow()">➕ Add Medicine / ওষুধ যোগ করুন</button>
    </div>

    <div class="card">
      <div class="ct">📝 Advice & Follow-up</div>
      <div class="row r2">
        <div class="fg"><label>Advice <span class="lbn">পরামর্শ</span></label><textarea id="rxadv" placeholder="Doctor's advice..."></textarea></div>
        <div class="fg">
          <div class="fg" style="margin-bottom:8px"><label>Next Visit <span class="lbn">পরবর্তী ভিজিট</span></label>
            <select id="rxnv"><option value="">No follow-up</option><option value="7">7 Days পর</option><option value="10">10 Days পর</option><option value="14">14 Days পর</option><option value="15">15 Days পর</option><option value="20">20 Days পর</option><option value="21">21 Days পর</option><option value="25">25 Days পর</option><option value="28">28 Days পর</option><option value="30">30 Days পর</option></select>
          </div>
          <div class="fg"><label>Fee ৳ <span class="lbn">ভিজিট ফি</span></label><input type="number" id="rxfee" value="0" min="0"></div>
        </div>
      </div>
    </div>

    <div class="brow">
      <button class="btn bp" id="saverxbtn" onclick="saveRx()">💾 Save & Print</button>
      <button class="btn bs" onclick="previewRx()">👁️ Preview</button>
      <button class="btn bd" onclick="clearRx()">🗑️ Clear</button>
    </div>
  </div>
</div>
<div id="pa"></div>

<script type="module">
import { loadAll, requireRole, renderHeader, getSession, openModal, closeModal, printHTML, sync, fadd, fset, fupd, INV, PTS, DOCS } from './js/core.js';

const session = await requireRole(['doctor','admin']);
if(session){
  await loadAll();
  renderHeader();
  initPage();
}

let medRows=[], curRxId='';

function genRxId(){
  let n=''; for(let i=0;i<8;i++) n+=Math.floor(Math.random()*10);
  curRxId='P'+n;
  document.getElementById('rxid').textContent='· '+curRxId;
}

function fillDocSel(){
  const sel=document.getElementById('rxdoc');
  sel.innerHTML='<option value="">— Select Doctor —</option>'+
    DOCS.filter(d=>!d.isCoFounder).map(d=>'<option value="'+d.id+'">'+d.name+(d.spec?' ('+d.spec+')':'')+'</option>').join('');
  if(session.role==='doctor'){ sel.value=session.myDocId; sel.disabled=true; }
  updDocInfo();
}
window.updDocInfo=function(){
  const id=document.getElementById('rxdoc').value;
  const d=DOCS.find(x=>x.id===id);
  document.getElementById('rxdocinfo').textContent =
    d ? (d.deg||'')+' · '+(d.spec||'')+(d.days?' · '+d.days:'') : '';
};

window.addMedRow=function(){
  const id=Date.now();
  medRows.push(id);
  const tr=document.createElement('tr');
  tr.id='mr-'+id;
  tr.innerHTML=
    '<td style="color:var(--t3);font-size:11px;font-weight:600">'+medRows.length+'</td>'+
    '<td style="text-align:left;padding:5px 5px">'+
      '<div class="mw">'+
        '<input class="mi" type="text" placeholder="Search..." autocomplete="off"'+
          ' oninput="doMedSearch(this,\'md'+id+'\')"'+
          ' onfocus="doMedSearch(this,\'md'+id+'\')">'+
        '<div class="mdrop" id="md'+id+'"></div>'+
      '</div>'+
    '</td>'+
    '<td><div class="dc"><div class="dt" onclick="this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'✓\':\'\'"></div></div></td>'+
    '<td><div class="dc"><div class="dt" onclick="this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'✓\':\'\'"></div></div></td>'+
    '<td><div class="dc"><div class="dt" onclick="this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'✓\':\'\'"></div></div></td>'+
    '<td><div class="dc"><div class="dt" onclick="this.classList.toggle(\'on\');this.textContent=this.classList.contains(\'on\')?\'✓\':\'\'"></div></div></td>'+
    '<td><select style="font-size:11px;padding:5px 3px"><option value="after">After</option><option value="before">Before</option></select></td>'+
    '<td><input type="number" min="1" max="90" placeholder="Days" style="width:44px;font-size:11px;text-align:center;padding:5px 3px"></td>'+
    '<td><button class="rmb" onclick="remMedRow('+id+')">✕</button></td>';
  document.getElementById('rxmeds').appendChild(tr);
};

window.remMedRow=function(id){
  medRows=medRows.filter(r=>r!==id);
  document.getElementById('mr-'+id)?.remove();
  document.querySelectorAll('#rxmeds tr').forEach((tr,i)=>tr.cells[0].textContent=i+1);
};

window.doMedSearch=function(input,dropId){
  const q=input.value.toLowerCase().trim();
  const drop=document.getElementById(dropId);
  if(!drop) return;
  const matches=q.length<1 ? INV.slice(0,10) : INV.filter(m=>m.name.toLowerCase().includes(q));
  if(!matches.length){ drop.classList.remove('on'); return; }
  const rect=input.getBoundingClientRect();
  drop.style.cssText='left:'+rect.left+'px;top:'+(rect.bottom+2)+'px;width:'+Math.max(rect.width,230)+'px;position:fixed';
  drop.innerHTML=matches.map(m=>{
    const st=m.stock===0?'<span style="color:var(--red);font-size:9px">Out</span>':m.stock<=m.reorder?'<span style="color:var(--gold);font-size:9px">Low</span>':'';
    return '<div class="mdi" onclick="pickMed(this,\''+dropId+'\')">'+
      '<div><div class="mdn">'+m.name+'</div><div class="mdm">'+m.type+' · '+(m.company||'')+'</div></div>'+
      '<div style="text-align:right"><div class="mds">Stk:'+m.stock+'</div>'+st+'</div></div>';
  }).join('');
  drop.classList.add('on');
};

window.pickMed=function(el,dropId){
  const drop=document.getElementById(dropId);
  const input=drop.parentElement?.querySelector('input');
  if(input) input.value=el.querySelector('.mdn').textContent;
  drop.classList.remove('on');
};

document.addEventListener('click',e=>{
  if(!e.target.closest('.mw') && !e.target.closest('.mdrop'))
    document.querySelectorAll('.mdrop').forEach(d=>d.classList.remove('on'));
});

function getAge(){
  const n=document.getElementById('rxagenum').value;
  const u=document.getElementById('rxageunit').value||'years';
  return n ? (n+' '+u) : '';
}

function getRxData(){
  const docId=document.getElementById('rxdoc').value||'';
  const docObj=DOCS.find(d=>d.id===docId)||null;
  const meds=[];
  document.querySelectorAll('#rxmeds tr').forEach(tr=>{
    const name=tr.querySelector('.mi')?.value?.trim();
    if(!name) return;
    const dots=tr.querySelectorAll('.dt');
    const inv2=INV.find(m=>m.name.toLowerCase()===name.toLowerCase());
    meds.push({
      name,
      morning:dots[0]?.classList.contains('on')||false,
      noon:dots[1]?.classList.contains('on')||false,
      evening:dots[2]?.classList.contains('on')||false,
      night:dots[3]?.classList.contains('on')||false,
      food:tr.querySelector('select')?.value||'after',
      days:parseInt(tr.querySelector('input[type=number]')?.value)||0,
      unitPrice:inv2?.sell||0,
      type:inv2?.type||''
    });
  });
  return {
    rxId:curRxId,
    date:new Date().toISOString().split('T')[0],
    dateStr:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),
    patient:document.getElementById('rxname').value.trim(),
    phone:document.getElementById('rxphone').value.trim(),
    age:getAge(),
    gender:document.getElementById('rxgender').value,
    bp:document.getElementById('rxbp').value,
    weight:document.getElementById('rxwt').value,
    fever:document.getElementById('rxfv').value,
    temp:document.getElementById('rxtemp').value,
    complaint:document.getElementById('rxcc').value,
    advice:document.getElementById('rxadv').value,
    nextVisit:document.getElementById('rxnv').value,
    fee:parseInt(document.getElementById('rxfee').value)||0,
    doctorId:docId,
    doctorName:docObj?.name||'Dr. Md. Omar Farook',
    doctorDeg:docObj?.deg||'B.D.RMP-DMS, MCHC (Dhaka)',
    doctorSpec:docObj?.spec||'Skin, Sex & General Medicine',
    doctorPhone:docObj?.phone||'01830079952',
    meds
  };
}

window.saveRx=async function(){
  const rx=getRxData();
  if(!rx.patient){ alert('⚠️ Enter patient name!'); return; }
  if(!rx.doctorId){ alert('⚠️ Please select a doctor!'); return; }
  const btn=document.getElementById('saverxbtn');
  btn.innerHTML='<span class="sp"></span>Saving...'; btn.disabled=true;
  try{
    await fset('prescriptions',rx.rxId,{...rx,savedAt:new Date().toISOString()});
    const ex=PTS.find(p=>p.phone===rx.phone && rx.phone!=='+8801');
    if(!ex){
      await fadd('patients',{name:rx.patient,phone:rx.phone,age:rx.age,gender:rx.gender,visits:1,lastVisit:rx.date,lastRxId:rx.rxId,ca:new Date().toISOString()});
    }else{
      await fupd('patients',ex.id,{visits:(ex.visits||0)+1,lastVisit:rx.date,lastRxId:rx.rxId,name:rx.patient,age:rx.age});
    }
    sync('✅ Saved!');
    printHTML(buildPrintRx(rx), false);
    clearRx(); genRxId();
  }catch(e){
    console.error('saveRx error:',e);
    alert('❌ Save failed: '+e.message);
  }finally{ btn.innerHTML='💾 Save & Print'; btn.disabled=false; }
};

window.previewRx=function(){ printHTML(buildPrintRx(getRxData()), true); };

function buildPrintRx(rx){
  const dc=v=>'<td style="text-align:center;color:'+(v?'#1a5c3a':'#ddd')+';font-weight:700;font-size:13px">'+(v?'✓':'—')+'</td>';
  const rows=rx.meds.map((m,i)=>
    '<tr><td style="text-align:center;color:#999;font-size:10px">'+(i+1)+'</td>'+
    '<td style="font-weight:600;padding:6px 8px">'+m.name+'</td>'+
    dc(m.morning)+dc(m.noon)+dc(m.evening)+dc(m.night)+
    '<td style="text-align:center;font-size:10px">'+(m.food==='before'?'Before':'After')+'</td>'+
    '<td style="text-align:center;font-weight:600">'+(m.days||'—')+'</td></tr>'
  ).join('');
  let nv='';
  if(rx.nextVisit){
    const d=new Date(rx.date); d.setDate(d.getDate()+parseInt(rx.nextVisit));
    nv='After '+rx.nextVisit+' days ('+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+')';
  }
  return '<div class="rxp" style="max-width:800px;margin:auto;border:1px solid #eee;padding:40px;position:relative;background:#fff">'+
    '<div class="rxph" style="display:flex;justify-content:space-between;border-bottom:2px solid #1a5c3a;padding-bottom:15px;margin-bottom:20px">'+
      '<div>'+
        '<div class="rxdn" style="font-size:22px;font-weight:800;color:#1a5c3a;font-family:\'Lora\',serif">'+rx.doctorName+'</div>'+
        '<div class="rxdd" style="font-size:13px;font-weight:600;color:#333;margin-top:2px">'+rx.doctorDeg+'</div>'+
        '<div class="rxdd" style="font-size:12px;color:#666">'+rx.doctorSpec+'</div>'+
        '<div class="rxdd" style="margin-top:8px;font-size:11px;color:#1a5c3a;font-weight:600">📍 A Islam Medical Hall, Kasba Puratan Bazar, Kasba, Brahmanbaria</div>'+
        '<div class="rxdd" style="font-size:11px;color:#444">📞 '+rx.doctorPhone+' &nbsp;|&nbsp; Clinic: 01884794060</div>'+
      '</div>'+
      '<div style="text-align:right">'+
        '<div style="font-family:\'Noto Serif Bengali\',serif;font-size:20px;font-weight:700;color:#1a5c3a">এ ইসলাম মেডিকেল হল</div>'+
        '<div style="font-size:11px;color:#22774d;font-weight:700;letter-spacing:0.5px;margin-top:2px">A ISLAM MEDICAL HALL</div>'+
        '<div style="font-size:11px;color:#7a9b8a;margin-top:5px">'+rx.dateStr+'</div>'+
        '<div style="font-size:15px;font-weight:800;color:#d32f2f;margin-top:5px;letter-spacing:1px">ID: '+rx.rxId+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="rxpb">'+
      '<span><b>Patient:</b> '+(rx.patient||'—')+'</span>'+
      '<span><b>Age:</b> '+(rx.age||'—')+'</span>'+
      '<span><b>Gender:</b> '+(rx.gender||'—')+'</span>'+
      (rx.phone&&rx.phone!=='+8801'?'<span><b>Ph:</b> '+rx.phone+'</span>':'')+
      (rx.bp?'<span><b>BP:</b> '+rx.bp+'</span>':'')+
      (rx.weight?'<span><b>Wt:</b> '+rx.weight+'</span>':'')+
      (rx.fever?'<span><b>Fever:</b> '+rx.fever+'</span>':'')+
      (rx.temp?'<span><b>Temp:</b> '+rx.temp+'</span>':'')+
    '</div>'+
    (rx.complaint?'<div style="margin-bottom:10px;font-size:12px"><b style="color:#1a5c3a">Complaint:</b> '+rx.complaint+'</div>':'')+
    '<div style="font-size:38px;font-family:\'Lora\',serif;color:#1a5c3a;opacity:0.12;line-height:1;margin-bottom:-5px">℞</div>'+
    '<table class="rxmt">'+
      '<thead><tr><th style="width:24px">#</th><th style="text-align:left;padding-left:8px">Medicine</th><th>☀️Mrng</th><th>🌤️Noon</th><th>🌥️Eve</th><th>🌙Night</th><th>Food</th><th>Days</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="8" style="text-align:center;color:#999;padding:10px">No medicines prescribed</td></tr>')+'</tbody>'+
    '</table>'+
    (rx.advice?'<div style="margin-top:12px;padding:8px 11px;background:#f2faf6;border-radius:7px;font-size:11px"><b style="color:#1a5c3a">Advice:</b> '+rx.advice+'</div>':'')+
    '<div class="rxft">'+
      '<div>'+(nv?'<b>Next Visit:</b> '+nv:'')+'</div>'+
      '<div style="text-align:right"><div style="font-size:12px;color:#ccc">______________________</div>'+
      '<div style="font-size:12px;font-weight:700;color:#1a5c3a">'+rx.doctorName+'</div>'+
      '<div style="font-size:10px;color:#7a9b8a">Fee: ৳'+rx.fee+'</div></div>'+
    '</div>'+
  '</div>';
}

window.clearRx=function(){
  ['rxname','rxbp','rxwt','rxfv','rxtemp','rxcc','rxadv'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('rxphone').value='+8801';
  document.getElementById('rxagenum').value='';
  document.getElementById('rxageunit').value='years';
  document.getElementById('rxgender').value='';
  document.getElementById('rxnv').value='';
  document.getElementById('rxfee').value='0';
  document.getElementById('rxmeds').innerHTML='';
  medRows=[];
  addMedRow();
};

function initPage(){
  document.getElementById('app').classList.add('on');
  fillDocSel();
  addMedRow();
  genRxId();
}
</script>
</body>
</html>
