<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passwords · A Islam Medical Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr"></div>
  <div class="nav" id="nav"></div>
  <div class="cnt">
    <h1 class="ptitle">🔑 Passwords <span class="bn" style="font-size:12px;font-weight:400;color:var(--t3)">পাসওয়ার্ড ব্যবস্থাপনা</span></h1>
    <div class="card">
      <div class="cs">View and update user passwords</div>
      <div id="passlist"><div class="al ali">⏳ Loading...</div></div>
    </div>
  </div>
</div>
<div id="pa"></div>

<script type="module">
import { loadAll, requireRole, renderHeader, sync, fupd, DOCS, STAFF } from './js/core.js';

const session = requireRole(['admin']);
if(session){
  await loadAll();
  renderHeader();
  document.getElementById('app').classList.add('on');
  renderPassList();
}

window.renderPassList=function(){
  const el=document.getElementById('passlist');
  const all=[...DOCS.map(d=>({...d,type:'Doctor',col:'doctors'})), ...STAFF.map(s=>({...s,type:'Staff',col:'staff'}))];
  if(!all.length){ el.innerHTML='<div class="al ali">No users found.</div>'; return; }
  el.innerHTML=all.map(u=>'<div class="dc2">'+
    '<div class="dav">'+u.name.charAt(0)+'</div>'+
    '<div class="dinfo">'+
      '<div class="dname">'+u.name+' <span class="badge bok">'+u.type+'</span></div>'+
      '<div class="row r2" style="margin-top:8px">'+
        '<div class="fg"><input type="text" id="pass-'+u.id+'" value="'+(u.pass||'')+'" style="padding:6px 10px;font-size:12px"></div>'+
        '<div class="fg"><button class="btn bp bsm" onclick="updPass(\''+u.col+'\',\''+u.id+'\')">💾 Update</button></div>'+
      '</div>'+
    '</div>'+
  '</div>').join('');
};

window.updPass=async function(collection,id){
  const newPass=document.getElementById('pass-'+id).value.trim();
  if(!newPass){ alert('Password cannot be empty!'); return; }
  try{
    await fupd(collection,id,{pass:newPass});
    sync('✅ Password updated!');
  }catch(e){ alert('Failed: '+e.message); }
};
</script>
</body>
</html>
