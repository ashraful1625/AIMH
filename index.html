<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login · A Islam Medical Hall</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="ov">
  <div class="ll">AIMH</div>
  <div class="ls bn">সিস্টেম লোড হচ্ছে...</div>
  <div class="lc"></div>
  <div class="le" id="oerr">
    <p id="oerr-msg">Connection failed. Check internet and try again.</p>
    <button class="btn bp bsm" onclick="location.reload()">🔄 Retry</button>
  </div>
</div>

<div id="login">
  <div class="lcard">
    <div class="chead">
      <div class="cem">AI</div>
      <div class="cn">A Islam Medical Hall</div>
      <div class="ca bn">কাসবা পুরাতন বাজার, কাসবা, ব্রাহ্মণবাড়িয়া</div>
    </div>
    <div class="rtabs">
      <button class="rtab on" id="rtab-doctor" onclick="selRole('doctor')"><span class="ri">👨‍⚕️</span>Doctor<br><span class="bn" style="font-size:9px">ডাক্তার</span></button>
      <button class="rtab" id="rtab-staff" onclick="selRole('staff')"><span class="ri">🧑‍💼</span>Staff<br><span class="bn" style="font-size:9px">কর্মচারী</span></button>
      <button class="rtab" id="rtab-admin" onclick="selRole('admin')"><span class="ri">🔐</span>Admin<br><span class="bn" style="font-size:9px">অ্যাডমিন</span></button>
    </div>
    <div class="lf" id="lprofile-sec" style="display:none">
      <label id="lprofile-lbl">Select Profile</label>
      <select id="lprofile" style="margin-top:5px"></select>
    </div>
    <div class="lf">
      <label>Password / পাসওয়ার্ড</label>
      <input type="password" id="lpass" placeholder="Enter password...">
    </div>
    <button class="lbtn" onclick="doLogin()">Login / প্রবেশ করুন</button>
    <div class="lerr" id="lerr">❌ Wrong password / ভুল পাসওয়ার্ড</div>
  </div>
  <div style="color:rgba(255,255,255,0.35);font-size:10px;margin-top:8px;text-align:center">Admin: admin123 · Staff: 5678</div>
</div>

<script type="module">
import { loadAll, getSession, setSession, SYS_PASS, DOCS, STAFF } from './js/core.js';

// Already logged in? Go straight to dashboard.
if(getSession()) location.replace('dashboard.html');

let sel='doctor';

window.selRole=function(r){
  sel=r;
  ['doctor','staff','admin'].forEach(x=>document.getElementById('rtab-'+x).classList.toggle('on',x===r));
  document.getElementById('lpass').value='';
  document.getElementById('lerr').style.display='none';
  const psec=document.getElementById('lprofile-sec');
  const psel=document.getElementById('lprofile');
  if(r==='admin'){ psec.style.display='none'; return; }
  psec.style.display='block';
  document.getElementById('lprofile-lbl').textContent = r==='doctor' ? 'Select Doctor' : 'Select Staff';
  const list = r==='doctor' ? DOCS : STAFF;
  psel.innerHTML = list.map(m=>'<option value="'+m.id+'">'+m.name+'</option>').join('')
    || '<option value="">No '+r+' found</option>';
};

window.doLogin=function(){
  const pass=document.getElementById('lpass').value.trim();
  const err=document.getElementById('lerr');
  let s=null;
  if(sel==='admin'){
    if(pass===SYS_PASS.admin) s={role:'admin',myDocId:'',name:'Admin'};
  }else if(sel==='doctor'){
    const d=DOCS.find(x=>x.id===document.getElementById('lprofile').value);
    if(d && (d.pass===pass || (d.isFounder && pass==='1234'))) s={role:'doctor',myDocId:d.id,name:d.name};
  }else{
    const st=STAFF.find(x=>x.id===document.getElementById('lprofile').value);
    if(st && (st.pass===pass || pass===SYS_PASS.staff)) s={role:'staff',myDocId:st.id,name:st.name};
  }
  if(s){ setSession(s); location.href='dashboard.html'; }
  else{ err.style.display='flex'; document.getElementById('lpass').value=''; }
};

document.getElementById('lpass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

(async function boot(){
  const t=setTimeout(()=>{
    document.getElementById('ov').querySelector('.lc').style.display='none';
    document.getElementById('oerr').classList.add('show');
  },8000);
  try{
    await loadAll();
    clearTimeout(t);
    document.getElementById('ov').classList.add('hide');
    document.getElementById('login').classList.add('on');
    selRole('doctor');
  }catch(e){
    clearTimeout(t);
    document.getElementById('ov').querySelector('.lc').style.display='none';
    document.getElementById('oerr-msg').textContent='Connection failed: '+e.message;
    document.getElementById('oerr').classList.add('show');
  }
})();
</script>
</body>
</html>
